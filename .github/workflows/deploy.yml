name: Deploy site

# Builds the site on every push. Only pushes to `main` publish it
# (to the `gh-pages` branch, which GitHub Pages serves).
# Pushes to other branches and pull requests just check that the site builds.
on:
  push:
    paths-ignore:
      - "README.md"
      - "CLEANUP_AUDIT.md"
      - "LICENSE"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          # Version comes from the .ruby-version file (same one `make` uses locally).
          bundler-cache: true
      - name: Build 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
